<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>FunASR 会议转录</title>
  <link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>
  <header>
    <h1>FunASR 会议转录</h1>
    <button id="settings-btn" class="header-btn">设置</button>
  </header>
  <main class="container">
    <div id="onboard-bar" class="onboard-bar hidden"></div>
    <div id="access-info" class="access-info hidden"></div>
    <section class="upload-card">
      <div id="dropzone" class="dropzone">
        <p>拖拽音频文件到此，或点击选择</p>
        <p class="hint">支持 wav / mp3 / m4a / aac / flac / ogg / opus</p>
        <input id="file-input" type="file" accept="audio/*,.m4a,.aac,.opus" hidden>
      </div>
      <div class="form-row">
        <label>会议标题 <input id="title" type="text" placeholder="例如：产品周会"></label>
        <button id="submit-btn" disabled>开始转录</button>
      </div>
      <div id="progress" class="progress hidden">
        <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>
        <div id="progress-text" class="progress-text"></div>
      </div>
      <div id="error" class="error hidden"></div>
    </section>
    <section>
      <h2>历史会议</h2>
      <ul id="history" class="history-list"></ul>
    </section>
  </main>

  <div id="settings-modal" class="modal hidden">
    <div class="modal-card">
      <h3>设置</h3>
      <div class="settings-tabs">
        <button class="stab active" data-stab="dir">数据目录</button>
        <button class="stab" data-stab="llm">LLM 配置</button>
        <button class="stab" data-stab="hotwords">热词</button>
      </div>

      <div class="spanel active" data-spanel="dir">
        <div class="dir-browser">
          <div class="dir-current">当前: <code id="dir-current">-</code></div>
          <ul id="dir-list" class="dir-list"></ul>
          <p class="hint" id="dir-writable"></p>
        </div>
        <details class="manual-input">
          <summary>手动输入路径（高级）</summary>
          <input id="data-dir-input" type="text" placeholder="/path/to/data">
          <button id="dir-goto" class="mini" type="button">跳转</button>
        </details>
        <div id="dir-result" class="settings-result"></div>
        <div class="modal-actions">
          <button id="dir-up-btn" class="mini" type="button">返回上级</button>
          <button id="dir-migrate-btn" class="hidden">迁移旧数据</button>
          <button id="dir-select-btn" class="primary" type="button">保存此目录</button>
        </div>
      </div>

      <div class="spanel" data-spanel="llm">
        <div class="radio-row">
          <label><input type="radio" name="llm-mode" value="ollama" checked> Ollama 本地</label>
          <label><input type="radio" name="llm-mode" value="api"> 在线 API</label>
        </div>
        <div id="llm-ollama" class="llm-fields">
          <label>服务地址 (base_url)<input id="ollama-url" type="text" value="http://localhost:11434/v1"></label>
          <div class="model-row">
            <label style="flex:1">模型 <select id="ollama-model"></select></label>
            <button id="ollama-refresh" class="mini" type="button">刷新列表</button>
          </div>
          <button id="ollama-test" class="mini" type="button">测试连接</button>
        </div>
        <div id="llm-api" class="llm-fields hidden">
          <label>base_url<input id="api-url" type="text" placeholder="https://api.openai.com/v1"></label>
          <label>model<input id="api-model" type="text" placeholder="gpt-4o-mini"></label>
          <label>api_key<input id="api-key" type="password" placeholder="留空不改"></label>
          <button id="api-test" class="mini" type="button">测试连接</button>
        </div>
        <div id="llm-result" class="settings-result"></div>
        <div class="modal-actions"><button id="llm-save-btn" class="primary" type="button">保存</button></div>
      </div>

      <div class="spanel" data-spanel="hotwords">
        <p class="hint">每行一个热词（短语效果最好：人名/地名/专业术语）。保存后下次识别自动加载，提升相关词的准确率。</p>
        <textarea id="hotwords-text" rows="10" style="width:100%;padding:8px;border:1px solid #d1d5db;border-radius:4px;font-size:13px;font-family:inherit;box-sizing:border-box;resize:vertical;"></textarea>
        <div id="hotwords-result" class="settings-result"></div>
        <div class="modal-actions"><button id="hotwords-save-btn" class="primary" type="button">保存热词</button></div>
      </div>

      <div class="modal-actions bottom">
        <button id="settings-close-btn" type="button">关闭</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js?v=3"></script>
</body>
</html>
